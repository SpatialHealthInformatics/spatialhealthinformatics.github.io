<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Members Only</title>
<link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
:root{--ink:#14212B;--muted:#4B5963;--line:#D9E0DC;--banner:#1D3F73;--red:#B3261E;--redsoft:#FCEDEC}
*{box-sizing:border-box}body{margin:0;font-family:"Century Gothic",CenturyGothic,"Didact Gothic",sans-serif;color:var(--ink);line-height:1.6;background:#fff}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}header{background:var(--banner);color:#fff}header .wrap{padding:36px 20px 28px}
header a{color:#cfe0f5;font-size:.9rem;text-decoration:none}h1{font-size:1.7rem;margin:8px 0 0}
.notice{margin:28px 0 18px;padding:18px 22px;background:var(--redsoft);border:1px solid #F0C4C1;border-left:6px solid var(--red);border-radius:10px}
.notice strong{display:block;color:var(--red);font-size:1.25rem;margin-bottom:6px}
footer{margin:28px 0 0;padding:18px 0 48px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
</style></head>
<body>
<header><div class="wrap"><a href="./">&larr; Spatial Health Informatics</a><h1>Disability Inclusion Recommendation Progress Report</h1></div></header>

<div class="notice" role="note"><strong>Restricted: members only.</strong>To request access, contact Genie Tang: noriko [at] berkeley [dot] edu</div>
</main>
<footer><div class="wrap">Spatial Health Informatics</div></footer>
